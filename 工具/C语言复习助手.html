<title>C语言复习助手</title>
<style>
  :root{

  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--txt);

    line-height:1.65;
  }
  header{
    position:sticky; top:0; z-index:10; background:rgba(15,17,23,.94);

  }
  .title{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:12px}
  h1{font-size:20px; margin:0; letter-spacing:.5px}
  .sub{color:var(--dim); font-size:13px}
  .bar{display:flex; gap:10px; flex-wrap:wrap}
  input[type=search],select{
    background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-radius:9px; padding:9px 12px; font-size:14px; font-family:inherit; outline:none;
  }
  input[type=search]{flex:1 1 280px; min-width:200px}
  input[type=search]:focus,select:focus{border-color:var(--acc)}
  main{max-width:960px; margin:0 auto; padding:20px}
  .count{color:var(--dim); font-size:13px; margin:4px 0 14px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    margin-bottom:12px; overflow:hidden; transition:border-color .15s;
  }
  .card:hover{border-color:#3a4257}
  .head{padding:14px 16px; cursor:pointer; display:flex; gap:10px; align-items:flex-start}
  .badge{
    flex:0 0 auto; font-size:12px; padding:2px 9px; border-radius:20px;
    background:rgba(91,157,255,.15); color:var(--acc); border:1px solid rgba(91,157,255,.35);
    white-space:nowrap; margin-top:3px;
  }
  .h-main{flex:1}
  .h-title{font-weight:600; font-size:15.5px}
  .h-concepts{color:var(--dim); font-size:13px; margin-top:3px}
  .arrow{color:var(--dim); font-size:13px; margin-top:3px; transition:transform .2s}
  .card.open .arrow{transform:rotate(90deg)}
  .body{display:none; padding:0 16px 16px; border-top:1px solid var(--line)}
  .card.open .body{display:block}
  .sec{margin-top:14px}
  .sec h3{
    font-size:13px; margin:0 0 6px; color:var(--acc2); font-weight:600;
    letter-spacing:.4px; text-transform:none;
  }
  .sec.warn h3{color:var(--warn)}
  ul{margin:0; padding-left:20px}
  li{margin:3px 0}
  code,pre{font-family:"Cascadia Code",Consolas,"Courier New",monospace}
  code{background:var(--panel2); padding:1px 6px; border-radius:5px; font-size:13px}
  pre{
    background:#0b0e14; border:1px solid var(--line); border-radius:9px;
    padding:12px; overflow:auto; font-size:13px; margin:8px 0 0;
  }
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:14px}
  .tag{font-size:12px; color:var(--dim); border:1px solid var(--line); border-radius:20px; padding:1px 9px}
  .sec pre{white-space:pre-wrap; word-break:break-word}
  #list .sec ul li[data-pre]{white-space:pre-wrap; font-family:"Cascadia Code",Consolas,"Courier New",monospace; font-size:12.5px}
  mark{background:rgba(255,180,84,.35); color:#fff; border-radius:3px; padding:0 2px}
  .empty{color:var(--dim); text-align:center; padding:40px 0}
  footer{color:var(--dim); font-size:12px; text-align:center; padding:24px 0 40px}
</style>
</head>

const $q = document.getElementById('q');
const $ch = document.getElementById('ch');
const $tg = document.getElementById('tg');
const $list = document.getElementById('list');
const $count = document.getElementById('count');
const openSet = new Set();

function uniq(a){ return [...new Set(a)]; }
const chapters = uniq(NOTES.map(n => n.chapter)).sort();
const tags = uniq(NOTES.flatMap(n => n.tags || [])).sort();
chapters.forEach(c => $ch.insertAdjacentHTML('beforeend', `<option value="${c}">${c}</option>`));
tags.forEach(t => $tg.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`));

function esc(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function hi(text, q){
  const t = esc(text);
  if (!q) return t;
  try {
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
    return t.replace(re, '<mark>$1</mark>');
  } catch(e){ return t; }
}
function hay(n){
  return [n.chapter,n.section,n.title,(n.concepts||[]).join(' '),(n.syntax||[]).join(' '),
          (n.examples||[]).join(' '),(n.pitfalls||[]).join(' '),(n.keywords||[]).join(' '),
          (n.selfTest||[]).join(' '),(n.tags||[]).join(' ')].join(' ').toLowerCase();
}
const listOf = (arr, q) => '<ul>' + (arr||[]).map(x => {
  const multi = String(x).indexOf('\n') >= 0;
  return `<li${multi ? ' data-pre=\"1\"' : ''}>${hi(x,q)}</li>`;
}).join('') + '</ul>';

function render(){
  const q = $q.value.trim();
  const ql = q.toLowerCase();
  const ch = $ch.value, tg = $tg.value;
  const items = NOTES.filter(n =>
    (!ch || n.chapter === ch) &&
    (!tg || (n.tags||[]).includes(tg)) &&
    (!ql || hay(n).includes(ql))
  );
  $count.textContent = `共 ${NOTES.length} 条知识点 · 当前显示 ${items.length} 条`;

  if (!items.length){ $list.innerHTML = '<div class="empty">没有匹配的内容，换个关键词试试</div>'; return; }

  $list.innerHTML = items.map((n, i) => {
    const id = n.chapter + '-' + n.section + '-' + i;
    const open = openSet.has(id) ? ' open' : '';
    return `<div class="card${open}" data-id="${id}">
      <div class="head">
        <span class="badge">${esc(n.chapter)} ${esc(n.section)}</span>
        <div class="h-main">
          <div class="h-title">${hi(n.title, q)}</div>
          <div class="h-concepts">${hi((n.concepts||[]).slice(0,3).join(' · '), q)}</div>
        </div>
        <span class="arrow">▶</span>
      </div>
      <div class="body">
        ${(n.concepts||[]).length ? `<div class="sec"><h3>核心知识点</h3>${listOf(n.concepts,q)}</div>` : ''}
        ${(n.syntax||[]).length ? `<div class="sec"><h3>语法格式</h3>${listOf(n.syntax,q)}</div>` : ''}
        ${(n.examples||[]).length ? `<div class="sec"><h3>示例说明</h3>${listOf(n.examples,q)}</div>` : ''}
        ${(n.pitfalls||[]).length ? `<div class="sec warn"><h3>易错点</h3>${listOf(n.pitfalls,q)}</div>` : ''}
        ${(n.selfTest||[]).length ? `<div class="sec"><h3>自测问题</h3>${listOf(n.selfTest,q)}</div>` : ''}
        ${(n.keywords||[]).length ? `<div class="tags">${(n.keywords||[]).map(k=>`<span class="tag">${hi(k,q)}</span>`).join('')}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

$list.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  card.classList.toggle('open');
  card.classList.contains('open') ? openSet.add(id) : openSet.delete(id);
});
$q.addEventListener('input', render);
$ch.addEventListener('change', render);
$tg.addEventListener('change', render);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $q.focus(); $q.select(); }
});
render();
</script>
</body>
</html>
